name: brainxp

services:
  api:
    image: ${IMAGE_API:-brainxp-api:local}
    build: { context: ., args: { WITH_OFFICE: "0" } }
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
      garage:   { condition: service_started }
    ports: ["127.0.0.1:8000:8000"]

  worker:
    image: ${IMAGE_WORKER:-brainxp-worker:local}
    build: { context: ., args: { WITH_OFFICE: "1" } }
    restart: unless-stopped
    env_file: .env
    command: ["python","-m","app.worker"]
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
      garage:   { condition: service_started }

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: brainxp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD belum diset}
      POSTGRES_DB: brainxp
    ports: ["${POSTGRES_PORT:-5555}:5432"]
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U brainxp -d brainxp"]
      interval: 5s
      timeout: 3s
      retries: 12

  garage:
    image: dxflrs/garage:v2.3.0
    restart: unless-stopped
    volumes:
      - ./deploy/garage.toml:/etc/garage.toml:ro
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data
    ports:
      - "127.0.0.1:3900:3900"
      - "127.0.0.1:3903:3903"
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server","--appendonly","yes","--requirepass","${REDIS_PASSWORD:?REDIS_PASSWORD belum diset}"]
    ports: ["${REDIS_PORT:-6666}:6379"]
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD","sh","-c","redis-cli -a \"$$REDIS_PASSWORD\" ping"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  pg_data:
  redis_data:
  garage_meta:
  garage_data:
