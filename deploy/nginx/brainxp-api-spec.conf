server {
    listen 80;
    listen [::]:80;
    server_name brainxp-api-spec.satu-miliar-pertama-di-2027.biz.id;

    root /var/www/brainxp-spec;
    index index.html;

    access_log /var/log/nginx/brainxp-api-spec.access.log;
    error_log  /var/log/nginx/brainxp-api-spec.error.log;

    location ^~ /.well-known/acme-challenge/ { root /var/www/html; default_type "text/plain"; }

    location = /openapi.json {
        default_type application/json;
        add_header Cache-Control "no-store";
        add_header Access-Control-Allow-Origin "*";
    }

    location = /API.md {
        default_type "text/plain; charset=utf-8";
        add_header Cache-Control "no-store";
    }

    location = /version.json {
        default_type application/json;
        add_header Cache-Control "no-store";
    }

    location = /try { return 301 /; }

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-store";
    }
}
