server {
    server_name brainxp-console.satu-miliar-pertama-di-2027.biz.id;

    location ^~ /.well-known/acme-challenge/ { root /var/www/html; default_type "text/plain"; }

    access_log /var/log/nginx/brainxp-console.access.log;
    error_log  /var/log/nginx/brainxp-console.error.log;

    location / {
        proxy_pass http://127.0.0.1:3903;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/brainxp-s3.satu-miliar-pertama-di-2027.biz.id/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/brainxp-s3.satu-miliar-pertama-di-2027.biz.id/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = brainxp-console.satu-miliar-pertama-di-2027.biz.id) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name brainxp-console.satu-miliar-pertama-di-2027.biz.id;
    return 404; # managed by Certbot


}