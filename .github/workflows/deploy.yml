name: Deploy

on:
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_API: ghcr.io/${{ github.repository }}/api
  IMAGE_WORKER: ghcr.io/${{ github.repository }}/worker

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      sha: ${{ steps.meta.outputs.sha }}
    steps:
      - uses: actions/checkout@v4

      - id: meta
        run: echo "sha=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: WITH_OFFICE=0
          push: true
          tags: |
            ${{ env.IMAGE_API }}:latest
            ${{ env.IMAGE_API }}:${{ steps.meta.outputs.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Build worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: WITH_OFFICE=1
          push: true
          tags: |
            ${{ env.IMAGE_WORKER }}:latest
            ${{ env.IMAGE_WORKER }}:${{ steps.meta.outputs.sha }}
          cache-from: type=gha,scope=worker
          cache-to: type=gha,scope=worker,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Prepare SSH key
        run: |
          install -d -m 700 ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${{ secrets.VPS_PORT || 22 }}" -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Sync deploy files
        run: |
          rsync -az --delete \
            -e "ssh -p ${{ secrets.VPS_PORT || 22 }} -i ~/.ssh/id_ed25519" \
            docker-compose.yml openapi.json API.md deploy \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/brainxp/deploy-staging/"
          ssh -p "${{ secrets.VPS_PORT || 22 }}" -i ~/.ssh/id_ed25519 \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" bash -s <<'REMOTE'
          set -euo pipefail
          cd /opt/brainxp
          install -m 644 deploy-staging/docker-compose.yml deploy-staging/openapi.json \
                         deploy-staging/API.md .
          rsync -a --exclude garage.toml deploy-staging/deploy/ deploy/
          rm -rf deploy-staging
          REMOTE

      - name: Publish API spec
        run: |
          ssh -p "${{ secrets.VPS_PORT || 22 }}" -i ~/.ssh/id_ed25519 \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            COMMIT="${{ github.sha }}" bash -s <<'REMOTE'
          set -euo pipefail
          cd /opt/brainxp
          SPEC=/var/www/brainxp-spec
          sudo install -d -m 755 "$SPEC"
          sudo install -m 644 openapi.json API.md "$SPEC/"
          sudo install -m 644 deploy/spec/index.html deploy/spec/favicon.svg "$SPEC/"
          VERSION="$(python3 -c 'import json;print(json.load(open("openapi.json"))["info"]["version"])')"
          PATHS="$(python3 -c 'import json;print(len(json.load(open("openapi.json"))["paths"]))')"
          printf '{"version":"%s","paths":%s,"commit":"%s","published_at":"%s"}\n' \
            "$VERSION" "$PATHS" "${COMMIT:0:12}" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            | sudo tee "$SPEC/version.json" >/dev/null
          sudo chmod 644 "$SPEC/version.json"
          echo "spesifikasi terbit: versi $VERSION, $PATHS path"
          REMOTE

      - name: Roll out release
        run: |
          ssh -p "${{ secrets.VPS_PORT || 22 }}" -i ~/.ssh/id_ed25519 \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            IMAGE_API="${{ env.IMAGE_API }}:${{ needs.build.outputs.sha }}" \
            IMAGE_WORKER="${{ env.IMAGE_WORKER }}:${{ needs.build.outputs.sha }}" \
            GH_ACTOR="${{ github.actor }}" \
            GH_TOKEN="${{ secrets.GITHUB_TOKEN }}" \
            bash -s <<'REMOTE'
          set -euo pipefail
          cd /opt/brainxp
          DC=(docker compose)

          echo "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin

          grep -q '^IMAGE_API='    .env && sed -i "s|^IMAGE_API=.*|IMAGE_API=$IMAGE_API|"       .env || echo "IMAGE_API=$IMAGE_API"       >> .env
          grep -q '^IMAGE_WORKER=' .env && sed -i "s|^IMAGE_WORKER=.*|IMAGE_WORKER=$IMAGE_WORKER|" .env || echo "IMAGE_WORKER=$IMAGE_WORKER" >> .env

          "${DC[@]}" pull api worker </dev/null
          "${DC[@]}" run --rm -T api python -m app.migrate </dev/null
          "${DC[@]}" up -d --remove-orphans </dev/null

          RUNNING="$("${DC[@]}" ps --format '{{.Service}} {{.Image}}' </dev/null)"
          echo "$RUNNING"
          for svc in api worker; do
            want="IMAGE_API"; [ "$svc" = worker ] && want="IMAGE_WORKER"
            expect="$(eval echo \$$want)"
            echo "$RUNNING" | grep -qx "$svc $expect" || {
              echo "rollout gagal: $svc tidak menjalankan $expect"
              docker logout ghcr.io >/dev/null
              exit 1
            }
          done

          for i in $(seq 1 30); do
            if "${DC[@]}" exec -T api curl -fsS http://localhost:8000/health >/dev/null 2>&1 </dev/null; then
              echo "healthy after ${i} attempt(s)"
              "${DC[@]}" exec -T api curl -s http://localhost:8000/health </dev/null
              docker image prune -f >/dev/null
              docker logout ghcr.io >/dev/null
              exit 0
            fi
            sleep 3
          done

          echo "never became healthy, keeping the previous release"
          "${DC[@]}" logs --tail 60 api </dev/null
          docker logout ghcr.io >/dev/null
          exit 1
          REMOTE
