name: CI

on:
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          uv venv
          uv pip install -e ".[dev]"
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Lint
        run: ruff check app tests scripts

      - name: Test
        run: pytest -q

      - name: API spec must be current
        run: python scripts/gen_openapi.py --check

      - name: Compose must be valid
        run: |
          cp .env.example .env
          docker compose -f docker-compose.yml config >/dev/null
          rm -f .env
